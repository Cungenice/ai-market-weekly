<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111820">
  <title>A/H AI 市场周报｜历史目录</title>
  <style>
    :root{--paper:#f5f3ed;--ink:#171c20;--muted:#687078;--line:#d7d3ca;--red:#a52a35;--night:#111820}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .wrap{max-width:1080px;margin:auto;padding:28px 24px 60px}.hero{background:var(--night);color:#fff;padding:42px 48px;border-top:6px solid var(--red)}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.18em;color:#e999a1}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.15;margin:15px 0}.hero p{margin:0;color:#c4cbd0}.back{display:inline-block;margin:18px 0;color:var(--red);font-weight:800;text-decoration:none}.section{border-top:2px solid var(--ink);padding-top:22px;margin-top:20px}.entry{padding:18px 0;border-bottom:1px solid var(--line)}.entry h2{font-size:21px;line-height:1.4;margin:4px 0}.entry h2 a{color:var(--ink);text-decoration:none}.entry h2 a:hover{color:var(--red)}.meta,.empty{color:var(--muted);font-size:13px}footer{margin-top:40px;border-top:2px solid var(--ink);padding-top:14px;color:var(--muted);font-size:12px}
    @media(max-width:680px){.wrap{padding:0 16px 36px}.hero{margin:0 -16px;padding:30px 22px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><div class="eyebrow">A/H EQUITY · AI & INNOVATION</div><h1>历史周报</h1><p>按期回看 A 股与港股科技创新、人工智能及市场动态。</p></header>
    <a class="back" href="../">← 返回最新周报</a>
    <section class="section"><h2>已发布期次</h2><p class="empty">首期周报将在下一次 workflow 运行后生成。</p></section>
    <footer>内容由公开新闻标题及摘要自动整理，阅读时请核对原文；不构成投资建议。</footer>
  </main>
</body>
</html>
