name: Manage published reports

on:
  workflow_dispatch:
    inputs:
      publish_date:
        description: "要删除的发布日期（YYYY-MM-DD）；最新一期不可删除"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gate self-test
        run: python tests/test_gates.py

      - name: Remove report by publication date
        env:
          PUBLISH_DATE: ${{ inputs.publish_date }}
        run: python scripts/manage_publications.py --delete-date "$PUBLISH_DATE"

      - name: Commit archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives.json weekly/
          git commit -m "Manage published weekly report archive"
          git push

      - name: Stage site files
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r weekly _site/weekly
          cp -r data _site/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: manage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
