# =============================================================================
# 财经周报 · 信源登记表与内容路由配置
# schema: wr-sources/v1
#
# 用法:
#   python source_registry.py lint                  # 校验配置自洽性
#   python source_registry.py route company_fact    # 查看某内容类型走哪些源
#   python source_registry.py policy cninfo         # 查看某源的生效策略
#   python source_registry.py selftest              # 断言集自测
#   python source_registry.py export-json out.json  # 导出解析后的路由给其他语言用
#
# 三条硬规则（改配置前先读）:
#   1. L4 只做线索，cite_as_fact 恒为 false，clue_only 恒为 true
#   2. L2 默认 redistribution: forbidden —— 付费终端数据未经授权不得公开传播
#   3. tier_policy 是默认值，source 级只能“更严”，不能更松（lint 会拦）
# =============================================================================

schema: wr-sources/v1
updated: "2026-10-30"

meta:
  report_name: 二级市场财经周报
  timezone: Asia/Shanghai
  cutoff_rule: "周五 15:00 收盘 + 周五 20:00 前公布的数据"
  publish_at: "周日 20:00"
  fail_policy: closed            # closed=闸门未过即阻断；open=降级发送（不建议）
  endpoint_verify_required: true # 所有 endpoint 上线前必须实测，verified 字段留痕

# -----------------------------------------------------------------------------
# 分层默认策略：按可信度分层，而不是按“我喜欢哪个网站”
# -----------------------------------------------------------------------------
tier_policy:
  L1:
    label: 法定披露与官方原始数据
    cite_as_fact: true
    requires_second_source: false
    redistribution: attribution_required
    allow_ai_paraphrase: false   # 监管/公告原文不得由模型改写
    max_age_hours: 168
  L2:
    label: 专业数据商与行情
    cite_as_fact: true
    requires_second_source: false
    redistribution: forbidden    # 默认不可公开传播，逐源授权后才放开
    allow_ai_paraphrase: true
    max_age_hours: 24
  L3:
    label: 行业与专业媒体
    cite_as_fact: false          # 只能作为背景与预期，不能作为事实来源
    requires_second_source: true
    redistribution: attribution_required
    allow_ai_paraphrase: true
    max_age_hours: 72
  L4:
    label: 社交与开放网络
    cite_as_fact: false
    clue_only: true              # 只触发检索，不许进正文
    requires_second_source: true
    redistribution: forbidden
    allow_ai_paraphrase: false
    max_age_hours: 24

# -----------------------------------------------------------------------------
# 断言集：字段级校验，供抓取层解析后立即调用
# -----------------------------------------------------------------------------
assertion_sets:
  quote_row:
    not_null: [code, close, as_of, unit]
    regex:
      code: '^[0-9]{6}(\.(SH|SZ|BJ|HK))?$'
      as_of: '^\d{4}-\d{2}-\d{2}$'
    range:
      close: [0, 10000000]
  pct_change:
    not_null: [value, unit, as_of]
    range:
      value: [-100, 1000]
  announcement:
    not_null: [doc_id, title, url, published_at]
    regex:
      url: '^https?://'
      published_at: '^\d{4}-\d{2}-\d{2}'
  macro_series:
    not_null: [period, value, unit]
    regex:
      period: '^\d{4}(-\d{2})?$'
  trade_calendar:
    not_null: [trade_date, is_open]
    regex:
      trade_date: '^\d{4}-\d{2}-\d{2}$'

# -----------------------------------------------------------------------------
# 信源登记表
#   tier / kind / content_types / endpoint 为必备字段
#   verified = 最近一次实测可达的日期；未实测填 null，抓取层拒绝启用
# -----------------------------------------------------------------------------
