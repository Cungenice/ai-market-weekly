# -----------------------------------------------------------------------------
# 内容类型 → 源 的路由
#   顺序即优先级；primary 第一位是“事实基准源”
#   forbidden 中的源一旦出现在引用链里，整条事实作废
# -----------------------------------------------------------------------------
content_routing:

  quote:
    label: 行情、成交与估值
    primary: [csindex, sse, szse, wind]
    secondary: [choice, ifind, chinabond]
    forbidden: [cls, xueqiu, guba, weibo]
    rules:
      min_independent_sources: 1
      max_age_hours: 24
      citation_format: "数据来源：{source}，截至 {as_of}"
      must_carry: [as_of, unit]
    note: 收盘数据须标注交易日；非交易日一律不写“最新”

  company_fact:
    label: 公司事实（业绩、股东、订单、诉讼）
    primary: [cninfo, sse, szse, hkexnews, sec_edgar]
    secondary: [csrc, gsxt, cnstock]
    forbidden: [xueqiu, guba, weibo, wechat_mp]
    rules:
      min_independent_sources: 1
      max_age_hours: 168
      citation_format: "据公司 {date} 公告（{doc_id}）"
      must_carry: [doc_id, url, published_at]
    note: 预告/快报/正式年报是三个口径，必须标注数据版本

  macro:
    label: 宏观数据
    primary: [stats, pbc, customs, mof]
    secondary: [wind, fred, chinabond]
    forbidden: [xueqiu, guba, weibo, cls]
    rules:
      min_independent_sources: 1
      max_age_hours: 720
      citation_format: "数据来源：{source}，{period}"
      must_carry: [period, unit]
    note: 跨期比较前先确认是否发生修订（GDP、社融均有修订）

  policy:
    label: 政策与监管
    primary: [csrc, pbc, mof, sse, szse]
    secondary: [stcn, caixin, yicai]
    forbidden: [wechat_mp, weibo, guba]
    rules:
      min_independent_sources: 1
      max_age_hours: 720
      citation_format: "据{source} {date} 发布的《{title}》"
      must_carry: [title, url, published_at]
    note: 只认官网原文；截图版红头文件一律视为未证实

  industry_data:
    label: 行业数据（销量、出货量、产能）
    primary: [caam, cpca, semi, customs]
    secondary: [trendforce, counterpoint, gasgoo, jiwei, wind]
    forbidden: [xueqiu, guba]
    rules:
      min_independent_sources: 1
      max_age_hours: 2160
      citation_format: "数据来源：{source}（{period}）"
      must_carry: [period, unit, scope]
    note: 口径差异最大的一类：批发/零售、含不含出口、按颗/按套，必须写清 scope

  ipo_governance:
    label: IPO 与公司治理
    primary: [cninfo, hkexnews, csrc, sec_edgar]
    secondary: [sse, szse, bse]
    forbidden: [wechat_mp, xueqiu, guba, weibo]
    rules:
      min_independent_sources: 1
      max_age_hours: 8760
      citation_format: "据《{title}》（{doc_id}，{date}）"
      must_carry: [doc_id, url, published_at, doc_type]
    note: 招股书/问询回复/股东会决议均需引原文条款，禁止概括为“公司表示”

  broker_view:
    label: 卖方观点与市场预期
    primary: [stcn, cnstock, yicai]
    secondary: [caixin, cls]
    forbidden: [guba, weibo]
    rules:
      min_independent_sources: 2
      max_age_hours: 168
      citation_format: "（{broker}，{date}）"
      must_carry: [broker, date]
    note: 观点必须署名机构与日期；不得写成“市场普遍认为”

  sentiment:
    label: 情绪与传闻
    primary: [irm, sse_info]
    secondary: [xueqiu, weibo, cls]
    forbidden: []
    rules:
      min_independent_sources: 2
      max_age_hours: 48
      citation_format: "（未经证实，来源：{source}）"
      must_carry: [url, captured_at]
    allow_clue_primary: true   # 本类内容本身就是线索，允许 L4 出现在首位
    note: 默认不进正文；确需提及必须标注“未经证实”且不得据此推导结论

# -----------------------------------------------------------------------------
# 发布前硬断言（fail-closed：任一项失败即阻断发布）
# -----------------------------------------------------------------------------
pre_publish_assertions:
  enabled: true
  placeholder_patterns:
    - '\{[a-zA-Z_]+\}'       # 模板占位符未替换
    - 'NaN|None|null|undefined'
    - '暂无|待补充|TODO|XXX'
  forbidden_phrases:         # 禁语库，命中即阻断
    - 建议买入
    - 建议卖出
    - 目标价
    - 必涨
    - 必跌
    - 稳赚
    - 抄底
    - 最后机会
    - 翻倍
  required_blocks:
    - name: disclaimer
      marker: 本报告不构成投资建议
    - name: cutoff
      marker: 数据截止
    - name: risk
      marker: 风险提示
  number_fingerprint:
    enabled: true            # 正文每个数字必须能在源数据表中找到
    tolerance_pct: 0.001
    allow_rounding: true
  link_check:
    enabled: true
    timeout_seconds: 10
    require_200: true
  length:
    min_chars: 3000
    max_chars: 20000
  citation_required:
    enabled: true            # 每个事实句必须挂 source_id
    min_citations: 5

# -----------------------------------------------------------------------------
# 发布控制
# -----------------------------------------------------------------------------
publish:
  schedule: "周日 20:00"
  timezone: Asia/Shanghai
  idempotency_key: "{issue_no}:{channel}:{recipient_id}"
  retract_window_minutes: 10
  channels:
    - id: wechat_mp
      daily_limit: 1
      batch_size: 1
      note: 一天一条，发布前需预演
    - id: email
      daily_limit: 1
      batch_size: 500
      note: SPF/DKIM/DMARC 必须配置，否则进垃圾箱
    - id: wecom_group
      daily_limit: 3
      batch_size: 20
      note: 群发有频控，分批带节流

quotas:
  weekly_main: 1
  weekly_flash: 2            # 突发行情快评配额，超出即压缩为一段话并入下期

alerts:
  levels:
    P0: 已发出错误内容 —— 立即撤回 + 全渠道通知 + 当日复盘
    P1: 未按时发出 —— 15 分钟内人工介入，超时升级电话
    P2: 数据部分缺失或降级 —— 本期可用，需在文末标注
    P3: 质量趋势下降 —— 计入周报周会
  heartbeat:
    enabled: true
    interval_minutes: 60
    note: 无任务时也需心跳，静默停摆是最难发现的事故

