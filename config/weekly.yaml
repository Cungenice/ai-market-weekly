schema: wr-weekly/v2

# 期次与节奏：期号锚定 ISO 周，区间固定为「本周一 09:30 → 下周一 09:30」
issue:
  cadence: weekly
  anchor_weekday: 0            # 0 = 周一
  anchor_time: "09:30"
  timezone: Asia/Shanghai
  edition_format: iso_week     # 2026-W44

# 标的池：公告只按池拉取，池外标的（含 ETF/基金例行披露）在源头就不会进入
stock_pool:
  a_share:
    - ["300308", "中际旭创", "光模块"]
    - ["300502", "新易盛", "光模块"]
    - ["300394", "天孚通信", "光模块"]
    - ["002463", "沪电股份", "算力硬件"]
    - ["300476", "胜宏科技", "算力硬件"]
    - ["601138", "工业富联", "算力硬件"]
    - ["000977", "浪潮信息", "算力硬件"]
    - ["688256", "寒武纪", "算力芯片"]
    - ["688041", "海光信息", "算力芯片"]
    - ["688008", "澜起科技", "算力芯片"]
    - ["688521", "芯原股份", "算力芯片"]
    - ["300223", "北京君正", "算力芯片"]
    - ["688981", "中芯国际", "晶圆制造"]
    - ["688396", "华润微", "晶圆制造"]
    - ["002371", "北方华创", "半导体设备"]
    - ["688012", "中微公司", "半导体设备"]
    - ["603501", "韦尔股份", "半导体设计"]
    - ["603986", "兆易创新", "半导体设计"]
    - ["002049", "紫光国微", "半导体设计"]
    - ["300782", "卓胜微", "半导体设计"]
    - ["002230", "科大讯飞", "AI 应用"]
    - ["688111", "金山办公", "AI 应用"]
    - ["300496", "中科创达", "AI 应用"]
    - ["300454", "深信服", "AI 应用"]
    - ["002415", "海康威视", "AI 应用"]
    - ["002236", "大华股份", "AI 应用"]
    - ["688036", "传音控股", "智能终端"]
    - ["000063", "中兴通讯", "通信设备"]

# 每个主题至少 1 家进入周报，避免某一细分赛道独占版面
theme_floor: 1
max_per_theme: 3

universe:
  max_items: 60
  per_market:
    A股: 24
    港股: 16
  max_filings_per_issuer: 1     # 同一发行人同期多条公告合并为一条
  max_other_updates: 6
  max_highlights: 4

# 公告类型：白名单决定抽取，黑名单决定源头不拉
filings:
  include_title_terms:
    - 季度报告
    - 年度报告
    - 半年度报告
    - 业绩预告
    - 业绩快报
    - 重大合同
    - 中标
    - 订单
    - 回购
    - 增持
    - 减持
    - 股权激励
    - 问询回复
    - 发行股份
    - 利润分配
    - 停牌
    - 复牌
  exclude_title_terms:
    - 提示性公告
    - 前十名股东
    - 回购股份报告书
    - 监事会
    - 独立董事候选人
    - 会计师事务所
  categories:
    - id: periodic
      label: 定期报告
      match: ["季度报告", "年度报告", "半年度报告"]
      gloss: 把报告期的经营与财务数据推到公开口径，是估值假设唯一可核对的基线
      focus: 看报告期收入与利润的环比方向、毛利率与费用率是否延续上季趋势
    - id: forecast
      label: 业绩预告
      match: ["业绩预告", "业绩快报"]
      gloss: 给出未经审计的业绩区间，等于提前暴露报告期的方向与量级
      focus: 看预告区间相对上一报告期的方向，以及公告给出的变动归因是否具体
    - id: buyback
      label: 股份回购
      match: ["回购"]
      gloss: 反映管理层对当前股价与资本配置的态度
      focus: 区分新设方案与既有方案的实施进展，看金额、价格上限与用途（注销还是激励）
    - id: order
      label: 订单合同
      match: ["重大合同", "中标", "订单"]
      gloss: 把一部分未来收入提前锁定，改变订单能见度
      focus: 看合同金额相对上一完整年度营收的量级，以及交付节奏与客户集中度
    - id: capital
      label: 资本运作
      match: ["发行股份", "资产重组", "股权激励", "利润分配"]
      gloss: 触动股本与利益分配结构，直接改变每股口径
      focus: 看对股本、每股指标与控制权的直接影响，以及是否附带业绩条件
    - id: shareholder
      label: 股东行为
      match: ["增持", "减持", "解禁"]
      gloss: 反映重要股东对当前价位的判断
      focus: 看变动比例、后续增减持计划，以及是否触及举牌或承诺边界
    - id: regulatory
      label: 监管事项
      match: ["问询回复", "停牌", "复牌"]
      gloss: 暴露监管关注点与披露完整性的边界
      focus: 看问询关注点是否得到实质回应，以及是否影响交易状态与信息披露完整性

# 行情通道
quote:
  market: 港股
  index_name: 恒生指数
  source: 香港交易所
  data_cutoff_note: 行情数据以交易所收市记录为准，当日未收市不计入

# 下周日历：规则推算为主，登记事项为辅
calendar:
  recurring:
    - id: cn_pmi
      name: 中国制造业 PMI
      window: [28, 31]
      note: 国家统计局月末发布当月 PMI
    - id: cn_trade
      name: 中国进出口数据
      window: [7, 14]
      note: 海关总署月初发布上月进出口
    - id: cn_price
      name: 中国 CPI / PPI
      window: [9, 15]
      note: 国家统计局月中发布上月物价数据
    - id: cn_credit
      name: 社融与新增信贷
      window: [10, 18]
      note: 中国人民银行月中发布上月金融数据
    - id: cn_activity
      name: 工业增加值与社会消费品零售
      window: [15, 20]
      note: 国家统计局月中发布上月经济活动数据
  deadlines:
    - id: q3_report
      name: 三季度报告披露截止
      month: 10
      day: 31
      note: 上市公司须于 10 月 31 日前完成三季报披露
    - id: annual_report
      name: 年度报告披露截止
      month: 4
      day: 30
      note: 上市公司须于次年 4 月 30 日前完成年报披露
    - id: h1_report
      name: 半年度报告披露截止
      month: 8
      day: 31
      note: 上市公司须于 8 月 31 日前完成半年报披露
  known_events: []
  # 需要人工维护的一次性事件，格式：
  # - {date: "2026-11-05", name: "美联储议息会议", note: "结果于北京时间次日凌晨公布"}

# 产业舆情：官方与白名单媒体双轨。官方必须是 .gov.cn 或部委域名；媒体只认白名单。
intel:
  max_items: 12
  max_per_thread: 4
  max_media_share: 0.6          # 媒体条目占比上限，避免白名单媒体挤掉官方口径
  max_resolve: 40               # 单期最多解析多少条 Google 跳转链接
  # 双轨信源：query 走 Google News 的 site: 限定，解析后仍按域名复核轨别
  feeds:
    - {track: official, source: 中国政府网, query: "site:gov.cn 人工智能 政策"}
    - {track: official, source: 工业和信息化部, query: "site:miit.gov.cn 人工智能"}
    - {track: official, source: 国家发展改革委, query: "site:ndrc.gov.cn 人工智能"}
    - {track: official, source: 国家互联网信息办公室, query: "site:cac.gov.cn 人工智能 生成式"}
    - {track: official, source: 科学技术部, query: "site:most.gov.cn 人工智能"}
    - {track: media, source: 财新, query: "site:caixin.com 人工智能"}
    - {track: media, source: 第一财经, query: "site:yicai.com 人工智能"}
    - {track: media, source: 21 世纪经济报道, query: "site:21jingji.com 人工智能"}
    - {track: media, source: 证券时报, query: "site:stcn.com 人工智能"}
    - {track: media, source: 上海证券报, query: "site:cnstock.com 人工智能"}
    - {track: media, source: 澎湃新闻, query: "site:thepaper.cn 人工智能"}
    - {track: media, source: 36 氪, query: "site:36kr.com 人工智能 融资"}
    - {track: media, source: 界面新闻, query: "site:jiemian.com 人工智能"}
    - {track: media, source: 财联社, query: "site:cls.cn 人工智能"}
  media_whitelist:
    - {domain: caixin.com, name: 财新}
    - {domain: yicai.com, name: 第一财经}
    - {domain: 21jingji.com, name: 21 世纪经济报道}
    - {domain: stcn.com, name: 证券时报}
    - {domain: cnstock.com, name: 上海证券报}
    - {domain: thepaper.cn, name: 澎湃新闻}
    - {domain: 36kr.com, name: 36 氪}
    - {domain: jiemian.com, name: 界面新闻}
    - {domain: cls.cn, name: 财联社}
  # 知识脉络：单选，与信息属性一一对应到页面的分组与徽标
  threads:
    - id: policy
      label: 产业政策
      def: 涉及人工智能领域的法律法规、发展规划、产业政策、监管规则、支持措施、行动方案或地方实施政策
    - id: project
      label: 重大项目
      def: 涉及人工智能重大项目、产业基地、算力设施、创新平台、签约落地、开工建设或投产进展
    - id: capital
      label: 投融资
      def: 涉及人工智能企业融资、投资、并购、上市、基金设立、战略投资或重大资本合作
    - id: industry
      label: 重要产业动态
      def: 涉及影响人工智能产业格局的重要企业动态、技术突破、产品发布、产业合作、生态建设或行业事件
    - id: other
      label: 其他
      def: 与人工智能产业政策、重大项目、投融资或重要产业动态无直接关系的内容
  attributes:
    - id: policy_release
      label: 政策发布
      def: 文章核心为人工智能相关政策、规划、规则或措施的发布、解读与落实
    - id: project_progress
      label: 项目进展
      def: 文章核心为人工智能相关重大项目的签约、落地、开工、建设、投产或阶段性进展
    - id: capital_event
      label: 资本事件
      def: 文章核心为人工智能领域融资、投资、并购、上市或基金等资本交易
    - id: cooperation
      label: 产业合作
      def: 文章核心为企业、机构或地方围绕人工智能开展的战略合作、生态协同或联合建设
    - id: tech_product
      label: 技术产品
      def: 文章核心为人工智能重要技术突破、模型或产品发布、商业化应用进展
    - id: other
      label: 其他
      def: 无法归入上述属性，但与巡查目标相关的其他信息
  # 相关性前置过滤：命中排除词直接丢，AI 主体词与产业事件词须同时出现在标题
  exclude_terms: [招聘, 校园宣讲, 宣讲会, 内推, 促销, 优惠, 折扣, 报名, 招生, 培训班, 训练营, 课程, 抽奖, 活动预告, 直播预告, 访谈, 专访, 演讲实录, 致辞, 会议议程, 视频, 座谈会, 圆桌, 研讨会, 征集, ETF]
  # 官方轨必须守住脉络的类别：媒体单源时降级并加「媒体口径」标记
  official_required_threads: [产业政策, 重大项目]

render:
  chart: true
  chart_days: 5
  max_source_rows: 24
  show_uncited: true

compliance:
  ai_label: 本页由程序与大模型协作生成，数字均经来源或计算核对，发布前经人工复核。
  disclaimers:
    - 本报告为公开信息整理与观点分享，不构成任何投资建议或要约。
    - 数据来自交易所、监管机构与上市公司披露，可能存在延迟、遗漏或口径差异。
    - 文中观点基于发布时点信息，可能随新信息变更，恕不另行通知。
    - 编制人及其关联方不持有文中提及标的，与所涉公司无业务往来。
    - 未经许可不得转载；引用请注明来源与本页链接。
  forbidden_phrases:
    - 建议买入
    - 建议卖出
    - 目标价
    - 必涨
    - 必跌
    - 抄底
    - 稳赚
    - 翻倍
    - 重仓
    - 满仓
  max_ai_disclaimer_repeat: 1

validation:
  overview_requires_number: true
  number_tolerance_abs: 0.06
  allow_year_range: [1990, 2100]
  ordinal_max: 20
  min_highlights: 1
  max_headline_chars: 56
  fallback_to_data_edition: true
  # 正文不得停在「谁在哪天发布了什么」：出现公告转述且没有解读词即判定失败
  require_disclosure_insight: true
  insight_terms: [意味, 说明, 透露, 反映, 口径, 横向, 对照, 可比, 结构, 节奏, 窗口, 同批, 分化, 定价, 能见度, 显性]
